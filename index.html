<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WW1 Naval Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:12px;color:#27241d;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(ellipse at 50% 0%,#60625c,#202321 75%)}
.app{width:min(680px,100%);margin:auto;padding:16px 18px;background:linear-gradient(rgba(255,255,255,.08),rgba(0,0,0,.04)),#d8c99f;border:5px double #60491f;box-shadow:0 18px 45px #0009,inset 0 0 35px #4f371c38}
.setup{max-width:430px;margin:10px auto 18px;padding:18px;border:2px solid #60491f;background:#efe3bf66}
.setup h1{text-align:center;font-size:1.55rem;letter-spacing:.1em;text-transform:uppercase;margin:0 0 16px}
.setup label{display:block;margin:12px 0 5px;font-weight:bold;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.setup input,.setup select{width:100%;padding:10px;border:2px solid #60491f;background:#eee1bb;color:#27241d;font:inherit}
.join{width:100%;margin-top:17px;padding:11px;color:#e6d9b4;background:linear-gradient(#5d625f,#303432);border:2px solid #60491f;border-radius:4px;font:inherit;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.error{margin-top:10px;color:#721d17;font-weight:bold;text-align:center}
.player-info{text-align:center;margin:4px 0 17px;color:#514a3a;font-size:.9rem}

.message-panel{margin:0 0 18px;padding:15px 14px 14px;background:#e2d3a8;border:2px solid #60491f;box-shadow:inset 0 0 14px #4d371e26,0 2px 4px #281e0f2e;position:relative}
.message-heading{font-size:.82rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#60491f;margin-bottom:7px}
.message-body{font-size:1.02rem;line-height:1.45;white-space:pre-wrap;padding-right:36px}
.dismiss-message{position:absolute;right:9px;top:9px;width:30px;height:30px;padding:0;border:1px solid #60491f;background:#c7b27c;color:#3e321d;border-radius:3px;font-size:1.1rem;cursor:pointer}
.hidden{display:none!important}
.tracker,.damage-dealt{margin:0 0 18px;padding:15px 12px 14px;background:#d9ca9f;border:2px solid #60491f;box-shadow:inset 0 0 14px #4d371e26,0 2px 4px #281e0f2e;overflow:hidden}
.tracker-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #60491f73;padding:0 4px 7px;margin-bottom:12px}
.tracker-name{font-size:1.22rem;letter-spacing:.11em;text-transform:uppercase;font-weight:bold}
.value{font-family:"Courier New",monospace;font-size:1.35rem;font-weight:bold;color:#60491f;min-width:42px;text-align:right}
.track-row{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;gap:8px;align-items:center}
.side-control{width:50px;height:58px;padding:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:bold;color:#29251b;background:linear-gradient(#c7a85f,#8b672c);border:2px solid #60491f;border-radius:5px;box-shadow:inset 0 1px rgba(255,255,255,.45),0 2px 3px rgba(0,0,0,.25);cursor:pointer}
.side-control:hover{background:linear-gradient(#d5b96e,#9b7737)}
.side-control:active{transform:translateY(1px)}
.track{min-width:0}
.dots,.numbers{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(3px,1vw,7px);width:100%;align-items:center}
.dot{appearance:none;width:100%;aspect-ratio:1;max-width:34px;min-width:0;justify-self:center;border-radius:50%;border:2px solid #60491f;background:radial-gradient(circle at 35% 30%,#69706e,#343938 65%,#222624);box-shadow:inset 0 1px 2px rgba(255,255,255,.3),0 2px 2px rgba(0,0,0,.25);cursor:pointer}
.dot:hover{transform:translateY(-1px) scale(1.04)}
.dot.active{background:radial-gradient(circle at 32% 28%,#e0c778,#a27d35 55%,#5d461d);border-color:#4c3918}
.dot.danger{background:radial-gradient(circle at 32% 28%,#d85a4b,#8d241d 55%,#4b120e);border-color:#4a1712;box-shadow:inset 0 1px 2px rgba(255,255,255,.35),0 0 7px rgba(130,35,25,.42)}
.numbers{margin-top:5px;color:#514a3a;font-family:"Courier New",monospace;font-size:clamp(.56rem,2vw,.76rem);text-align:center}
.damage-dealt-number{text-align:center;font-family:"Courier New",monospace;font-size:2rem;font-weight:bold;color:#60491f}
.damage-dealt .tracker-header{margin-bottom:12px}
.damage-dealt .track-row{grid-template-columns:50px minmax(0,1fr) 50px}
@media(max-width:420px){body{padding:7px 5px}.app{padding:12px 9px;border-width:4px}.track-row{grid-template-columns:40px minmax(0,1fr) 40px;gap:5px}.side-control{width:40px;height:52px;font-size:1.5rem}.tracker,.damage-dealt{padding:14px 7px 13px}.dots,.numbers{gap:3px}}
</style>
</head>
<body>
<main class="app">

<section id="setup" class="setup">
<h1>Join Battle</h1>

<label for="gameCode">Game Code</label>
<input id="gameCode" type="text" autocomplete="off" placeholder="Enter code from GM">

<label for="playerName">Your Name</label>
<input id="playerName" type="text" autocomplete="name" placeholder="Enter your name">

<label for="team">Team</label>
<select id="team">
<option value="1">Team 1</option>
<option value="2">Team 2</option>
<option value="3">Team 3</option>
</select>

<button class="join" id="join" type="button">Join Battle</button>
<div id="error" class="error"></div>
</section>

<section id="screen" class="hidden">
<div id="messagePanel" class="message-panel hidden">
  <button id="dismissMessage" class="dismiss-message" type="button" aria-label="Dismiss message">×</button>
  <div class="message-heading">⚓ Message from GM</div>
  <div id="messageBody" class="message-body"></div>
</div>
<div id="info" class="player-info"></div>

<section class="tracker" data-name="hull">
<div class="tracker-header"><div class="tracker-name">Hull</div><div class="value">0</div></div>
<div class="track-row">
<button class="side-control minus" type="button">−</button>
<div class="track"><div class="dots"></div><div class="numbers"></div></div>
<button class="side-control plus" type="button">+</button>
</div>
</section>

<section class="tracker" data-name="terror">
<div class="tracker-header"><div class="tracker-name">Terror</div><div class="value">0</div></div>
<div class="track-row">
<button class="side-control minus" type="button">−</button>
<div class="track"><div class="dots"></div><div class="numbers"></div></div>
<button class="side-control plus" type="button">+</button>
</div>
</section>

<section class="tracker" data-name="fate">
<div class="tracker-header"><div class="tracker-name">Fate</div><div class="value">0</div></div>
<div class="track-row">
<button class="side-control minus" type="button">−</button>
<div class="track"><div class="dots"></div><div class="numbers"></div></div>
<button class="side-control plus" type="button">+</button>
</div>
</section>

<section class="damage-dealt">
<div class="tracker-header"><div class="tracker-name">Damage Dealt</div><div class="value" id="damageDealtValue">0</div></div>
<div class="track-row">
<button class="side-control" id="damageDealtMinus" type="button">−</button>
<div class="damage-dealt-number" id="damageDealtNumber">0</div>
<button class="side-control" id="damageDealtPlus" type="button">+</button>
</div>
</section>

</section>
</main>

<script>
// ============================================================
// SUPABASE CONNECTION
// Replace the two values below with YOUR Supabase project
// URL and publishable key.
// ============================================================

const SUPABASE_URL = "https://srrkkobqngadfhgukxjz.supabase.co";
const SUPABASE_KEY = "sb_publishable_DChcj7jOoTnXUIfh2f3-Fg_FPWOrMwb";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentPlayer = null;
let realtimeChannel = null;
let messageChannel = null;

const setup = document.getElementById("setup");
const screen = document.getElementById("screen");
const errorBox = document.getElementById("error");

function showError(message) {
  errorBox.textContent = message;
}

function drawTracker(name, value) {
  const tracker = document.querySelector(`.tracker[data-name="${name}"]`);
  if (!tracker) return;

  value = Math.max(0, Math.min(12, Number(value) || 0));
  tracker.querySelector(".value").textContent = value;

  tracker.querySelectorAll(".dot").forEach((dot, index) => {
    const point = index + 1;
    dot.classList.toggle("active", point <= value);
    dot.classList.toggle("danger", point >= 7 && point <= value);
  });
}

function drawAll(player) {
  drawTracker("hull", player.hull);
  drawTracker("terror", player.terror);
  drawTracker("fate", player.fate);

  const dealt = Math.max(0, Number(player.damage_dealt) || 0);
  document.getElementById("damageDealtValue").textContent = dealt;
  document.getElementById("damageDealtNumber").textContent = dealt;
}

async function saveScore(field, value) {
  if (!currentPlayer) return;

  value = Math.max(0, Number(value) || 0);

  // Hull, Terror and Fate have a maximum of 12.
  if (field !== "damage_dealt") {
    value = Math.min(12, value);
  }

  const update = {};
  update[field] = value;

  const { data, error } = await db
    .from("players")
    .update(update)
    .eq("id", currentPlayer.id)
    .select()
    .single();

  if (error) {
    console.error(error);
    showError("Could not save that change.");
    return;
  }

  currentPlayer = data;
  drawAll(currentPlayer);
}

function buildTrackers() {
  document.querySelectorAll(".tracker").forEach(tracker => {
    const name = tracker.dataset.name;
    const dots = tracker.querySelector(".dots");
    const numbers = tracker.querySelector(".numbers");

    for (let i = 1; i <= 12; i++) {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.type = "button";
      dot.setAttribute("aria-label", `${name} ${i}`);
      dot.addEventListener("click", () => saveScore(name, i));
      dots.appendChild(dot);

      const number = document.createElement("div");
      number.textContent = i;
      numbers.appendChild(number);
    }

    tracker.querySelector(".minus").addEventListener("click", () => {
      saveScore(name, Math.max(0, Number(tracker.querySelector(".value").textContent) - 1));
    });

    tracker.querySelector(".plus").addEventListener("click", () => {
      saveScore(name, Math.min(12, Number(tracker.querySelector(".value").textContent) + 1));
    });
  });
}

async function joinBattle() {
  errorBox.textContent = "";

  const gameCode = document.getElementById("gameCode").value.trim().toUpperCase();
  const playerName = document.getElementById("playerName").value.trim();
  const team = Number(document.getElementById("team").value);

  if (!gameCode || !playerName) {
    showError("Please enter your game code and name.");
    return;
  }

  const { data: game, error: gameError } = await db
    .from("games")
    .select("id, game_code, game_name")
    .eq("game_code", gameCode)
    .single();

  if (gameError || !game) {
    console.error(gameError);
    showError("Game not found. Check the code with the GM.");
    return;
  }

  const { data: player, error: playerError } = await db
    .from("players")
    .insert({
      game_id: game.id,
      name: playerName,
      team: team
    })
    .select()
    .single();

  if (playerError) {
    console.error(playerError);
    showError("Could not join the battle.");
    return;
  }

  currentPlayer = player;

  setup.classList.add("hidden");
  screen.classList.remove("hidden");

  document.getElementById("info").textContent =
    `${player.name} · Team ${player.team}`;

  drawAll(player);
  subscribeToPlayer();
  subscribeToMessages();
}


function showMessage(message) {
  document.getElementById("messageBody").textContent = message;
  document.getElementById("messagePanel").classList.remove("hidden");
}

function dismissMessage() {
  document.getElementById("messagePanel").classList.add("hidden");
  document.getElementById("messageBody").textContent = "";
}

function subscribeToMessages() {
  if (!currentPlayer) return;

  if (messageChannel) {
    db.removeChannel(messageChannel);
  }

  messageChannel = db
    .channel("messages-" + currentPlayer.id)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: `game_id=eq.${currentPlayer.game_id}`
      },
      payload => {
        const message = payload.new;

        const isForAll = message.recipient_type === "all";

        const isForTeam =
          message.recipient_type === "team" &&
          Number(message.recipient_team) === Number(currentPlayer.team);

        const isForPlayer =
          message.recipient_type === "player" &&
          message.recipient_player_id === currentPlayer.id;

        if (isForAll || isForTeam || isForPlayer) {
          showMessage(message.message);
        }
      }
    )
    .subscribe();
}

function subscribeToPlayer() {
  if (!currentPlayer) return;

  realtimeChannel = db
    .channel("player-" + currentPlayer.id)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "players",
        filter: `id=eq.${currentPlayer.id}`
      },
      payload => {
        currentPlayer = payload.new;
        drawAll(currentPlayer);
      }
    )
    .subscribe();
}

document.getElementById("dismissMessage").addEventListener("click", dismissMessage);

document.getElementById("damageDealtMinus").addEventListener("click", () => {
  if (!currentPlayer) return;
  saveScore(
    "damage_dealt",
    Math.max(0, Number(document.getElementById("damageDealtNumber").textContent) - 1)
  );
});

document.getElementById("damageDealtPlus").addEventListener("click", () => {
  if (!currentPlayer) return;
  saveScore(
    "damage_dealt",
    Number(document.getElementById("damageDealtNumber").textContent) + 1
  );
});

document.getElementById("join").addEventListener("click", joinBattle);

buildTrackers();
</script>
</body>
</html>
